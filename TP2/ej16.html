<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CUIL/CUIT - Ejercicio 16</title>
    <!-- Vinculamos nuestro CSS final -->
    <link rel="stylesheet" href="css/style16.css">
</head>
<body>

    <main class="contenedor-validador">
        <h1>Validador de CUIL / CUIT</h1>
        <p>Ingrese un número de CUIL o CUIT (con o sin guiones):</p>
        
        <div class="caja-entrada">
            <!-- input type="text" para permitir que pongan los guiones si quieren -->
            <input type="text" id="input-cuil" placeholder="Ej: 20-12345678-6">
            <button id="btn-validar">Validar</button>
        </div>

        <!-- Aquí mostraremos Verdadero o el mensaje de Error -->
        <div id="resultado-validacion" class="resultado-oculto"></div>
        
    </main>

    <!-- Vinculamos el archivo con el algoritmo Módulo 11 -->
    <script src="js/script16.js"></script>
</body>
</html>
