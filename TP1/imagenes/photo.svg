<!-- <svg>: elemento raíz SVG. Atributos en uso: xmlns, width, height, viewBox -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- <rect>: fondo. Atributos: width, height, fill (aquí 100% y color) -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <!-- <circle>: círculo. Atributos en uso: cx, cy, r, fill. Otros: stroke, stroke-width -->
  <circle cx="150" cy="90" r="50" fill="#c77" />
  <!-- segundo <rect>: barra inferior. Atributos: x, y, width, height, rx, fill -->
  <rect x="40" y="120" width="220" height="50" rx="8" fill="#ddd"/>
  <!-- <text>: texto. Atributos: x, y, font-family, font-size, text-anchor, fill -->
  <text x="150" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Foto de ejemplo</text>
</svg>