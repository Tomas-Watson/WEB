<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de Arreglos - Ejercicio 10</title>
    <link rel="stylesheet" href="css/style10.css">
</head>
<body>

    <main class="contenedor-app">
        <h1>Sumar Números</h1>
        <p>Ingresa números enteros separados por comas (ej: 5, 10, 15):</p>
        
        <!-- Campo de entrada para que el usuario tipee los números -->
        <input type="text" id="input-numeros" placeholder="Ej: 1, 2, 3">
        
        <!-- Botón que disparará la función en JavaScript -->
        <button id="btn-calcular">Calcular Suma</button>
        
        <!-- Párrafo donde mostraremos el resultado -->
        <p id="resultado-suma"></p>
    </main>

    <!-- Vinculamos el archivo de lógica JS al final del body -->
    <script src="js/script10.js"></script>
</body>
</html>
